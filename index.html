<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#101820">
    <title>Bakim Modu</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #101820;
        --muted: #5f6b72;
        --line: #d9e1e5;
        --paper: #f7f4ef;
        --accent: #167a72;
        --accent-dark: #0e5751;
        --warm: #d99b3d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(217, 155, 61, 0.22), transparent 34rem),
          linear-gradient(135deg, #fbfaf7 0%, var(--paper) 56%, #e8f0ef 100%);
        color: var(--ink);
      }

      main {
        width: min(760px, 100%);
        padding: clamp(28px, 7vw, 64px);
        border: 1px solid rgba(16, 24, 32, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 24px 70px rgba(16, 24, 32, 0.12);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 48px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        font-size: 17px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--accent-dark);
        background: #fff;
        font-size: 14px;
        font-weight: 700;
      }

      .pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--warm);
        box-shadow: 0 0 0 7px rgba(217, 155, 61, 0.18);
      }

      h1 {
        max-width: 660px;
        margin: 0;
        font-size: clamp(40px, 8vw, 76px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      p {
        max-width: 580px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(17px, 2.4vw, 20px);
        line-height: 1.6;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 38px;
      }

      .detail {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.62);
      }

      .detail strong {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
      }

      .detail span {
        display: block;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        color: var(--accent-dark);
        text-decoration: underline;
      }

      @media (max-width: 620px) {
        body {
          place-items: stretch;
          padding: 16px;
        }

        main {
          min-height: calc(100vh - 32px);
          display: flex;
          flex-direction: column;
          justify-content: center;
        }

        .brand {
          margin-bottom: 36px;
        }

        .details {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <div class="brand" aria-label="SAMM">
        <span class="mark">S</span>
        <span>SAMM</span>
      </div>

      <div class="status">
        <span class="pulse" aria-hidden="true"></span>
        Bakim modu aktif
      </div>

      <h1 id="page-title">Sitemizi yeniliyoruz.</h1>
      <p>
        Daha iyi bir deneyim hazirlamak icin kisa bir bakim arasindayiz.
        Calismalar tamamlandiginda tekrar yayinda olacagiz.
      </p>

      <section class="details" aria-label="Iletisim ve durum">
        <div class="detail">
          <strong>Durum</strong>
          <span>Planli bakim calismasi devam ediyor.</span>
        </div>
        <div class="detail">
          <strong>Iletisim</strong>
          <span>Acil konular icin mevcut iletisim kanallarimizdan bize ulasabilirsiniz.</span>
        </div>
      </section>
    </main>
  </body>
</html>
